[package]
name = "inbuxa-cli"
description = "Command-line administration for the inbuxa mail server"
version = "2026.10.26"
authors = ["Coffey Labs LLC <legal@coffeylabs.org>"]
license = "AGPL-3.0-only"
repository = "https://git.coffeylabs.org/inbuxa/inbuxa-cli"
homepage = "https://git.coffeylabs.org/inbuxa/inbuxa-cli"
edition = "2024"
readme = "README.md"

[[bin]]
name = "inbuxa-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive", "env"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0.18"
ureq = { version = "3.3.0", default-features = false, features = ["json", "gzip", "rustls-no-provider", "platform-verifier"] }
rustls = { version = "0.23.40", default-features = false, features = ["aws-lc-rs", "std", "tls12", "logging"] }
base64 = "0.22"

[profile.release]
lto = "thin"
strip = true
